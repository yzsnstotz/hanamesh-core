name: Core and DSH bundle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm beside the pinned Node
        run: |
          ci_node_prefix=$(node --input-type=module -e "import {dirname} from 'node:path'; console.log(dirname(dirname(process.execPath)))")
          npm install --global --prefix "$ci_node_prefix" pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix scripts/ci
      - run: python3 scripts/ci/test_gates.py
      - run: python3 scripts/ci/run.py
      - run: pnpm build
      - run: pnpm verify:inputs
      - run: pnpm check:contracts
      - run: pnpm test
      - name: Check child cleanup 100 times under full CPU contention
        run: node test/process-cleanup-stress.mjs
      - run: pnpm test:contract
      - run: pnpm test:mutations
      - run: pnpm pack --pack-destination artifacts
      - run: pnpm verify:pack
      - run: pnpm preflight
