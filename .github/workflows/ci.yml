name: Core and DSH bundle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix scripts/ci
      - run: python3 scripts/ci/test_gates.py
      - run: python3 scripts/ci/run.py
      - run: pnpm build
      - run: pnpm verify:inputs
      - run: pnpm check:contracts
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm test:mutations
      - run: pnpm pack --pack-destination artifacts
      - run: pnpm verify:pack
      - run: pnpm preflight
