name: Core and DSH bundle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm beside the pinned Node
        run: |
          ci_node_prefix=$(node --input-type=module -e "import {dirname} from 'node:path'; console.log(dirname(dirname(process.execPath)))")
          npm install --global --prefix "$ci_node_prefix" pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix scripts/ci
      - run: python3 scripts/ci/test_gates.py
      - run: python3 scripts/ci/run.py
      - run: pnpm build
      - run: pnpm verify:inputs
      - run: pnpm check:contracts
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm test:mutations
      - run: pnpm pack --pack-destination artifacts
      - run: pnpm verify:pack
      - run: pnpm preflight
      - name: Verify independent Market package
        working-directory: packages/hanamesh-market
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          pnpm test:contract
          pnpm test:mutations
          pnpm pack
          pnpm verify:pack
      - name: Preserve local batch evidence and normal packages
        if: ${{ always() && env.ACT == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, local act artifact server only
        with:
          name: core-local-batch
          path: |
            artifacts
            packages/hanamesh-market/artifacts
            packages/hanamesh-market/*.tgz
          if-no-files-found: error
